name: Katalog-Import

on:
  schedule:
    - cron: '0 3 * * *' # täglich 03:00 UTC, nach dem Scryfall-Bulk-Update
  workflow_dispatch:
    inputs:
      args:
        description: 'Zusätzliche Argumente, z.B. --sets=lea,mh3 oder --limit=500'
        required: false
        default: ''

concurrency:
  group: catalog-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1 # nacheinander, um die Datenbank nicht dreifach zu belasten
      matrix:
        game: [yugioh, pokemon, mtg]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Import ${{ matrix.game }}
        run: bun run import "$GAME" $IMPORT_ARGS
        env:
          GAME: ${{ matrix.game }}
          IMPORT_ARGS: ${{ github.event.inputs.args }}
          NUXT_DATABASE_URL: ${{ secrets.NUXT_DATABASE_URL }}
